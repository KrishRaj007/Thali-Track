name: thalitrack
region: blr # Bangalore region for minimal latency in India
databases:
  - engine: PG
    name: db-thalitrack
    num_nodes: 1
    size: db-s-dev-database
    version: "16"

services:
  # 1. Frontend Web Service
  - name: web
    dockerfile_path: web/Dockerfile
    source_dir: web
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /

  # 2. Node.js Backend API
  - name: api
    dockerfile_path: api/Dockerfile
    source_dir: api
    http_port: 4000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db-thalitrack.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        value: thalitrack-secure-jwt-production-2026
      - key: FORECAST_SERVICE_URL
        scope: RUN_TIME
        value: http://${forecast.PRIVATE_IP}:8000
      - key: NODE_ENV
        scope: RUN_TIME
        value: production

  # 3. Python FastAPI Forecasting Microservice
  - name: forecast
    dockerfile_path: forecast/Dockerfile
    source_dir: forecast
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: PYTHONUNBUFFERED
        scope: RUN_TIME
        value: "1"

